{% extends 'base.html' %}
{% block title %}Create Account &bull; DevHub{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-8">
  <div class="bg-gh-canvas border border-gh-border rounded-xl p-8 shadow-2xl">
    <div class="text-center mb-6">
      <div class="inline-flex w-12 h-12 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-500 items-center justify-center text-white mb-3 shadow-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Create your developer profile</h1>
      <p class="text-sm text-gh-muted mt-1">Join the developer network and showcase your projects</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="username" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Username *</label>
          <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="e.g. dev_alex"
            class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
        </div>
        <div>
          <label for="display_name" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Display Name</label>
          <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}" placeholder="e.g. Alex Johnson"
            class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
        </div>
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Email Address *</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="alex@example.com"
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="password" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Password *</label>
          <input type="password" id="password" name="password" required placeholder="Min 6 characters"
            class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
        </div>
        <div>
          <label for="confirm_password" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="Repeat password"
            class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
        </div>
      </div>

      <div>
        <label for="title" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Developer Role / Title</label>
        <input type="text" id="title" name="title" value="{{ title or '' }}" placeholder="e.g. Full Stack Developer, ML Engineer, Rustacean"
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
      </div>

      <div>
        <label for="skills" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Tech Stack &amp; Skills (Comma-separated)</label>
        <input type="text" id="skills" name="skills" value="{{ skills or '' }}" placeholder="e.g. Python, Docker, React, TypeScript, FastAPI"
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
      </div>

      <button type="submit" class="w-full bg-gh-green hover:bg-gh-greenHover text-white font-semibold py-2.5 px-4 rounded-lg shadow transition-colors text-sm mt-2">
        Create DevHub Account
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-gh-border text-center text-sm text-gh-muted">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-gh-accent hover:underline font-medium">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
