{% extends 'base.html' %}
{% block title %}500 &bull; Server Error &bull; DevHub{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-16 text-center">
  <div class="w-16 h-16 mx-auto rounded-2xl bg-gh-subtle border border-amber-900/50 flex items-center justify-center text-amber-400 mb-4">
    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
  </div>
  <h1 class="text-4xl font-extrabold text-white tracking-tight">500</h1>
  <p class="text-sm text-gh-muted mt-2">An internal error occurred. Please check console logs.</p>
  <div class="mt-6">
    <a href="{{ url_for('main.index') }}" class="inline-flex items-center gap-2 bg-gh-subtle hover:bg-gh-border text-white text-xs font-semibold px-4 py-2 rounded-lg transition-colors">
      Return to Home
    </a>
  </div>
</div>
{% endblock %}
