{% extends 'base.html' %}
{% block title %}New Issue &bull; {{ project.name }} &bull; DevHub{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto my-6">
  <div class="bg-gh-canvas border border-gh-border rounded-xl p-8 shadow-sm">
    
    <div class="border-b border-gh-border pb-4 mb-6">
      <div class="text-xs text-gh-muted mb-1">
        <a href="{{ url_for('projects.view_project', project_id=project.id) }}" class="text-gh-accent hover:underline">{{ project.name }}</a>
        <span>/</span>
        <a href="{{ url_for('projects.list_issues', project_id=project.id) }}" class="text-gh-accent hover:underline">Issues</a>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Open a New Issue</h1>
    </div>

    <form method="POST" action="{{ url_for('projects.create_issue', project_id=project.id) }}" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label for="title" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Issue Title *</label>
        <input type="text" id="title" name="title" required placeholder="e.g. Bug: ZeroDivisionError in vector normalizer" autofocus
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
      </div>

      <div>
        <label for="label" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Type / Label</label>
        <select id="label" name="label" class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none">
          <option value="bug">Bug Report</option>
          <option value="enhancement">Feature Request / Enhancement</option>
          <option value="question">Question</option>
          <option value="documentation">Documentation</option>
        </select>
      </div>

      <div>
        <label for="body" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Description (Markdown supported)</label>
        <textarea id="body" name="body" rows="8" placeholder="Describe the issue, steps to reproduce, or proposed feature..."
          class="w-full bg-gh-bg border border-gh-border rounded-lg p-3 text-sm text-gh-text focus:border-gh-accent focus:outline-none transition-colors"></textarea>
      </div>

      <div class="pt-4 border-t border-gh-border flex justify-end gap-3">
        <a href="{{ url_for('projects.list_issues', project_id=project.id) }}" class="px-4 py-2 rounded-lg text-sm text-gh-muted hover:text-white transition-colors">Cancel</a>
        <button type="submit" class="bg-gh-green hover:bg-gh-greenHover text-white font-semibold py-2 px-6 rounded-lg shadow text-sm transition-colors">
          Submit Issue
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
