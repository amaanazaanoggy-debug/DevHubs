{% extends 'base.html' %}
{% block title %}Create a New Repository &bull; DevHub{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto my-6">
  <div class="bg-gh-canvas border border-gh-border rounded-xl p-8 shadow-2xl">
    
    <div class="border-b border-gh-border pb-4 mb-6">
      <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
        <svg class="w-6 h-6 text-gh-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Create a New Project Repository
      </h1>
      <p class="text-xs text-gh-muted mt-1">A repository contains all project files, README documentation, issues, and revision history.</p>
    </div>

    <form method="POST" action="{{ url_for('projects.create') }}" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Owner / Repo Name Row -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Owner</label>
          <input type="text" disabled value="{{ current_user.username }}"
            class="w-full bg-gh-subtle border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-muted cursor-not-allowed">
        </div>
        <div class="sm:col-span-2">
          <label for="name" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Repository Name *</label>
          <input type="text" id="name" name="name" required placeholder="e.g. neural-search-engine" autofocus
            class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
        </div>
      </div>

      <!-- Tagline -->
      <div>
        <label for="tagline" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Tagline / Short Summary</label>
        <input type="text" id="tagline" name="tagline" placeholder="e.g. Ultra-fast vector similarity search built in Python &amp; Rust"
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
      </div>

      <!-- Primary Language & License -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="primary_language" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Primary Language</label>
          <select id="primary_language" name="primary_language" class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none">
            <option value="Python">Python</option>
            <option value="JavaScript">JavaScript</option>
            <option value="TypeScript">TypeScript</option>
            <option value="Rust">Rust</option>
            <option value="Go">Go</option>
            <option value="C++">C++</option>
            <option value="Java">Java</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label for="license" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">License</label>
          <select id="license" name="license" class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none">
            <option value="MIT">MIT License</option>
            <option value="Apache-2.0">Apache 2.0</option>
            <option value="GPL-3.0">GNU GPL v3</option>
            <option value="BSD-3-Clause">BSD 3-Clause</option>
            <option value="Unlicense">The Unlicense (Public Domain)</option>
          </select>
        </div>
      </div>

      <!-- Topics -->
      <div>
        <label for="topics" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Topics &amp; Tags (Comma-separated)</label>
        <input type="text" id="topics" name="topics" placeholder="e.g. search, machine-learning, api, cli"
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none transition-colors">
      </div>

      <!-- Optional URLs -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="github_url" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">GitHub Mirror URL (Optional)</label>
          <input type="url" id="github_url" name="github_url" placeholder="https://github.com/..."
            class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none transition-colors">
        </div>
        <div>
          <label for="demo_url" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Live Demo Website (Optional)</label>
          <input type="url" id="demo_url" name="demo_url" placeholder="https://..."
            class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none transition-colors">
        </div>
      </div>

      <!-- Initial README.md content -->
      <div>
        <label for="readme_content" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Initialize README.md (Markdown)</label>
        <textarea id="readme_content" name="readme_content" rows="6" placeholder="# My Project&#10;&#10;Description of the project...&#10;&#10;## Features&#10;- Blazing fast&#10;- Secure&#10;&#10;## Getting Started&#10;```bash&#10;python app.py&#10;```"
          class="w-full bg-gh-bg border border-gh-border rounded-lg p-3 text-xs font-mono text-gh-text focus:border-gh-accent focus:outline-none transition-colors"></textarea>
      </div>

      <!-- Visibility Options -->
      <div class="border-t border-gh-border pt-4">
        <label class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-3">Visibility</label>
        <div class="space-y-2">
          <label class="flex items-start gap-3 p-3 rounded-lg border border-gh-border bg-gh-bg/50 cursor-pointer hover:bg-gh-subtle/50 transition-colors">
            <input type="radio" name="is_public" value="1" checked class="mt-1 text-emerald-500 focus:ring-0">
            <div>
              <span class="font-semibold text-white text-sm block">Public</span>
              <span class="text-xs text-gh-muted">Anyone on your local network or machine can view this repository.</span>
            </div>
          </label>
          <label class="flex items-start gap-3 p-3 rounded-lg border border-gh-border bg-gh-bg/50 cursor-pointer hover:bg-gh-subtle/50 transition-colors">
            <input type="radio" name="is_public" value="0" class="mt-1 text-emerald-500 focus:ring-0">
            <div>
              <span class="font-semibold text-white text-sm block">Private</span>
              <span class="text-xs text-gh-muted">Only you can view and access this repository when logged in.</span>
            </div>
          </label>
        </div>
      </div>

      <div class="pt-4 border-t border-gh-border flex justify-end gap-3">
        <a href="{{ url_for('projects.list_projects') }}" class="px-4 py-2 rounded-lg text-sm text-gh-muted hover:text-white transition-colors">Cancel</a>
        <button type="submit" class="bg-gh-green hover:bg-gh-greenHover text-white font-semibold py-2 px-6 rounded-lg shadow text-sm transition-colors">
          Create Repository
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
