{% extends 'base.html' %}
{% block title %}Add File &bull; {{ project.name }} &bull; DevHub{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto my-6">
  <div class="bg-gh-canvas border border-gh-border rounded-xl p-8 shadow-sm">
    
    <div class="border-b border-gh-border pb-4 mb-6">
      <div class="flex items-center gap-2 text-xs text-gh-muted mb-1">
        <a href="{{ url_for('projects.view_project', project_id=project.id) }}" class="text-gh-accent hover:underline">{{ project.name }}</a>
        <span>/</span>
        <span>New file</span>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Add File to {{ project.name }}</h1>
    </div>

    <form method="POST" action="{{ url_for('projects.add_file', project_id=project.id) }}" enctype="multipart/form-data" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Filename input -->
      <div>
        <label for="filename" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">File Name *</label>
        <div class="flex items-center gap-2">
          <span class="text-sm text-gh-muted font-mono">{{ project.name }}/</span>
          <input type="text" id="filename" name="filename" required placeholder="e.g. main.py, server.js, index.html, config.json"
            class="flex-1 bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm font-mono text-gh-text focus:border-gh-accent focus:ring-1 focus:ring-gh-accent focus:outline-none transition-colors">
        </div>
      </div>

      <!-- File Content Editor -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="content" class="block text-xs font-semibold text-gh-text uppercase tracking-wider">File Content</label>
          <span class="text-xs text-gh-muted">Syntax highlighted automatically based on extension</span>
        </div>
        <textarea id="content" name="content" rows="16" placeholder="# Paste or type your code here..."
          class="w-full bg-gh-bg border border-gh-border rounded-lg p-4 font-mono text-xs text-emerald-300 focus:border-gh-accent focus:outline-none transition-colors"></textarea>
      </div>

      <!-- Or Upload from PC -->
      <div class="p-4 rounded-xl border border-dashed border-gh-border bg-gh-subtle/30">
        <label class="block text-xs font-semibold text-white mb-1">Or upload an existing file from your PC:</label>
        <input type="file" name="file_upload"
          class="text-xs text-gh-muted file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-gh-subtle file:text-white hover:file:bg-gh-border cursor-pointer">
      </div>

      <div class="pt-4 border-t border-gh-border flex justify-end gap-3">
        <a href="{{ url_for('projects.view_project', project_id=project.id) }}" class="px-4 py-2 rounded-lg text-sm text-gh-muted hover:text-white transition-colors">Cancel</a>
        <button type="submit" class="bg-gh-green hover:bg-gh-greenHover text-white font-semibold py-2 px-6 rounded-lg shadow text-sm transition-colors">
          Commit New File
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
