{% extends 'base.html' %}
{% block title %}Account Security &bull; DevHub{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-6 space-y-6">

  <div class="bg-gh-canvas border border-gh-border rounded-xl p-8 shadow-sm">
    <div class="border-b border-gh-border pb-4 mb-6">
      <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
        <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        Account Security
      </h1>
      <p class="text-xs text-gh-muted mt-1">Manage your local account password and cryptographic security</p>
    </div>

    <form method="POST" action="{{ url_for('profile.security_settings') }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label for="current_password" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Current Password</label>
        <input type="password" id="current_password" name="current_password" required
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none transition-colors">
      </div>

      <div>
        <label for="new_password" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">New Password (Min 6 characters)</label>
        <input type="password" id="new_password" name="new_password" required minlength="6"
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none transition-colors">
      </div>

      <div>
        <label for="confirm_password" class="block text-xs font-semibold text-gh-text uppercase tracking-wider mb-1.5">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
          class="w-full bg-gh-bg border border-gh-border rounded-lg px-3.5 py-2 text-sm text-gh-text focus:border-gh-accent focus:outline-none transition-colors">
      </div>

      <div class="pt-4 border-t border-gh-border flex justify-end gap-3">
        <a href="{{ url_for('profile.view_profile', username=current_user.username) }}" class="px-4 py-2 rounded-lg text-sm text-gh-muted hover:text-white transition-colors">Cancel</a>
        <button type="submit" class="bg-gh-green hover:bg-gh-greenHover text-white font-semibold py-2 px-6 rounded-lg shadow text-sm transition-colors">
          Update Password
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
